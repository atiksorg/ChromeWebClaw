<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>WebClaw by ProTalk — Agent Working Tab</title>
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%; overflow: hidden;
      background: #0b0d11; color: #e6e8eb;
      font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* === Floating control bar (overlay, does NOT affect iframe layout) === */
    #bar {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 999999;
      display: flex; align-items: center; gap: 8px;
      padding: 6px 10px;
      background: rgba(17, 20, 27, 0.92);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border-bottom: 1px solid #1f2330;
      font-size: 12px;
      transition: opacity 0.3s ease, transform 0.3s ease;
      pointer-events: auto;
    }
    #bar.auto-hide {
      opacity: 0;
      transform: translateY(-100%);
      pointer-events: none;
    }
    #bar:hover, #bar:focus-within {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }
    /* Hot zone: invisible strip at top that reveals the bar on hover */
    #hover-zone {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 24px;
      z-index: 999998;
    }
    #hover-zone:hover ~ #bar,
    #hover-zone:hover + #bar {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    #bar .logo {
      font-size: 16px;
      margin-right: 4px;
    }
    #bar .title {
      font-weight: 600;
      color: #9aa3af;
      font-size: 11px;
      letter-spacing: 0.5px;
    }
    #bar input {
      flex: 1; padding: 5px 8px; background: #1a1d24; color: #e6e8eb;
      border: 1px solid #2a2f3a; border-radius: 4px; font: inherit;
    }
    #bar button {
      padding: 5px 10px; background: #2563eb; color: #fff; border: 0; border-radius: 4px; cursor: pointer;
      font-size: 12px;
    }
    #bar button.ghost { background: #2a2f3a; }
    #bar button.mini { padding: 4px 7px; font-size: 11px; }
    #status { color: #9aa3af; margin-left: auto; font-variant-numeric: tabular-nums; font-size: 11px; }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #555; margin-right: 4px; }
    .dot.running { background: #4ade80; box-shadow: 0 0 6px #4ade80; }
    .dot.paused  { background: #facc15; }
    .dot.waiting { background: #38bdf8; box-shadow: 0 0 6px #38bdf8; animation: pulse-wait 1.5s ease-in-out infinite; }
    .dot.error   { background: #f87171; }

    @keyframes pulse-wait {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* === Iframe fills the ENTIRE viewport (no Y-shift from #bar) === */
    #frame {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
    }

    /* === Debug info overlay (bottom-left) === */
    #debug-info {
      position: fixed;
      bottom: 8px; left: 8px;
      z-index: 999999;
      font-size: 10px;
      color: rgba(156, 163, 175, 0.6);
      pointer-events: none;
    }

    /* === Agent-active mode: hide overlays so CDP events pass through to iframe === */
    body.agent-active #hover-zone,
    body.agent-active #bar {
      display: none !important;
      pointer-events: none !important;
    }
    body.agent-active #debug-info {
      display: none !important;
    }
  </style>
</head>
<body>
  <!-- Invisible hover zone to reveal bar -->
  <div id="hover-zone"></div>

  <!-- Floating control bar overlay -->
  <div id="bar">
    <span class="logo">🦞</span>
    <span class="title">WebClaw by ProTalk</span>
    <span class="dot" id="dot"></span>
    <input id="url" placeholder="https://..." />
    <button id="go">Go</button>
    <button id="reload" class="ghost">⟳</button>
    <button id="hide-bar" class="ghost mini" title="Hide bar (hover top edge to reveal)">━</button>
    <span id="status">ready</span>
  </div>

  <!-- Iframe fills entire viewport -->
  <iframe id="frame" referrerpolicy="no-referrer-when-downgrade"></iframe>

  <!-- Debug info -->
  <div id="debug-info"></div>

  <script src="agent.js"></script>
</body>
</html>
